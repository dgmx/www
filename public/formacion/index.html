<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Constructor Method</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #f98012; color: #fff; padding: 20px 40px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
  header h1 { font-size: 1.4em; font-weight: 400; }
  header .logo { font-size: 1.8em; }
  .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; flex: 1; }
  .view { display: none; }
  .view.active { display: block; }

  /* Course list */
  h2 { font-size: 1.3em; color: #333; margin-bottom: 20px; font-weight: 400; border-bottom: 2px solid #f98012; padding-bottom: 8px; }
  .course-grid { display: flex; flex-direction: column; gap: 16px; }
  .course-card { background: #fff; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 20px 24px; cursor: pointer; transition: box-shadow .15s, transform .15s; border-left: 5px solid #f98012; }
  .course-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.18); transform: translateY(-2px); }
  .course-card h3 { font-size: 1.15em; color: #1a1a2e; margin-bottom: 6px; }
  .course-card p { font-size: .92em; color: #555; line-height: 1.5; margin-bottom: 8px; }
  .course-card .teacher { font-size: .88em; color: #888; }
  .course-card .teacher strong { color: #f98012; font-weight: 600; }

  /* Login */
  .login-wrapper { max-width: 440px; margin: 40px auto; }
  .login-box { background: #fff; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,.1); overflow: hidden; }
  .login-header { background: #f98012; color: #fff; padding: 16px 24px; font-size: 1.1em; display: flex; align-items: center; gap: 10px; }
  .login-body { padding: 28px 24px; }
  .login-body label { display: block; font-size: .92em; color: #333; margin-bottom: 5px; }
  .login-body input[type="text"],
  .login-body input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: .95em; margin-bottom: 18px; transition: border-color .15s; }
  .login-body input:focus { outline: none; border-color: #f98012; }
  .login-actions { display: flex; gap: 10px; }
  .btn { padding: 10px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: .95em; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: #f98012; color: #fff; }
  .btn-secondary { background: #e0e0e0; color: #333; }
  .btn-back { background: transparent; color: #f98012; border: 1px solid #f98012; }
  .error { display: none; padding: 12px 16px; background: #fdecea; color: #b71c1c; border-radius: 4px; font-size: .9em; margin-bottom: 18px; border: 1px solid #f5c6cb; }
  .error.show { display: block; }
  .cancel-link { color: #888; font-size: .9em; text-decoration: none; display: inline-block; margin-top: 14px; }
  .cancel-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <span class="logo">&#x1F393;</span>
  <h1>The Constructor Method</h1>
</header>

<div class="container">

  <!-- Course list view -->
  <div id="courseView" class="view active">
    <h2>Cursos disponibles</h2>
    <div class="course-grid" id="courseList"></div>
  </div>

  <!-- Login view -->
  <div id="loginView" class="view">
    <div class="login-wrapper">
      <div class="login-box">
        <div class="login-header">
          <span>&#x1F512;</span>
          <span id="loginTitle">Iniciar sesión</span>
        </div>
        <div class="login-body">
          <div class="error" id="loginError">Usuario o contraseña incorrectos. No se ha podido iniciar sesión.</div>
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="usuario" autocomplete="off">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="******">
          <div class="login-actions">
            <button class="btn btn-primary" id="loginBtn">Acceder</button>
            <button class="btn btn-back" id="backBtn">&#x2190; Volver</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const courses = [
  {
    title: 'Planificación y administración de redes',
    desc: 'Curso del módulo Planificación y Administración de Redes del Ciclo Formativo de Grado Superior Administración de Sistemas Informáticos y Redes (ASIR)',
    teacher: 'Diego J. Gonzalez'
  },
  {
    title: 'Administración de sistemas operativos',
    desc: 'Curso del módulo Administración de sistemas operativos del Ciclo Formativo de Grado Superior Administración de Sistemas Informáticos y Redes (ASIR)',
    teacher: 'Diego J. Gonzalez'
  },
  {
    title: 'Programación Python',
    desc: 'Curso práctico de introducción a Python para ingeniería y ciencia de datos',
    teacher: 'Diego J. Gonzalez'
  },
  {
    title: 'Programación de servicios y procesos',
    desc: 'Curso del módulo Programación de servicios y procesos del Ciclo Formativo de Grado Superior Desarrollo de aplicaciones multiplataforma. (DAM)',
    teacher: 'Diego J. Gonzalez'
  },
  {
    title: 'Lenguajes de marcas y sistemas de gestión de información',
    desc: 'Curso del módulo Lenguajes de marcas y sistemas de gestión de información del Ciclo Formativo de Grado Superior Desarrollo de aplicaciones web (DAW)',
    teacher: 'Diego J. Gonzalez'
  },
  {
    title: 'Programación',
    desc: 'Curso del módulo Programación del Ciclo Formativo de Grado Superior Desarrollo de aplicaciones web y multiplataforma (DAW) (DAM)',
    teacher: 'Diego J. Gonzalez'
  },
  {
    title: 'Bases de Datos',
    desc: 'Curso del módulo Bases de Datos del Ciclo Formativo de Grado Superior Desarrollo de aplicaciones web y multiplataforma (DAW) (DAM)',
    teacher: 'Diego J. Gonzalez'
  }
];

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderCourses() {
  const list = document.getElementById('courseList');
  list.innerHTML = courses.map(c => `
    <div class="course-card">
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
      <div class="teacher"><strong>Profesor:</strong> ${c.teacher}</div>
    </div>
  `).join('');
  list.querySelectorAll('.course-card').forEach(card => {
    card.addEventListener('click', () => {
      showView('loginView');
    });
  });
}

document.getElementById('loginBtn').addEventListener('click', () => {
  document.getElementById('loginError').classList.add('show');
});

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('loginError').classList.remove('show');
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  showView('courseView');
});

renderCourses();
</script>

</body>
</html>
